name: HciCursorStudy
options:
  bundleIdPrefix: com.hcicursorstudy
  deploymentTarget:
    iOS: "16.0"

targets:
  HciCursorStudy:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "*.yaml"
          - "*.md"
          - ".github/**"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hcicursorstudy.app
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
